<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget & Salary Calculator</title>
    <meta name="description" content="Calculate your required gross salary based on expenses, tax rates, and real-time exchange rates.">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://budget.neuhaus.co">
    <meta property="og:title" content="Bridge - Budget & Salary Calculator">
    <meta property="og:description" content="Calculate your required gross salary based on expenses and taxes in real-time.">
    <meta property="og:image" content="https://budget.neuhaus.co/og-image.png">
    <meta property="og:site_name" content="Budget & Salary Calculator">
    <meta property="og:locale" content="en_US">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Budget & Salary Calculator">
    <meta name="twitter:description" content="Calculate your required gross salary based on expenses, tax rates, and real-time exchange rates.">
    <meta name="twitter:image" content="https://budget.neuhaus.co/og-image.png">
    <meta name="twitter:site" content="@aneuhaus">
    <meta name="twitter:creator" content="@aneuhaus">
    <meta name="twitter:domain" content="budget.neuhaus.co">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg'%3e%3ctext y='32' font-size='32'%3e💵%3c/text%3e%3c/svg%3e" />
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
            --accent: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(16, 185, 129, 0.15) 0px, transparent 50%);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #6366f1, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 1.5rem;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input, select {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            color: var(--text);
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .budget-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            max-height: 500px;
            overflow-y: auto;
            padding-right: 0.5rem;
        }

        .budget-item {
            display: grid;
            grid-template-columns: 1fr 90px 40px;
            gap: 0.75rem;
            align-items: center;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn {
            cursor: pointer;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            border: none;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-muted);
            padding: 0.5rem;
        }

        .btn-ghost:hover {
            color: var(--danger);
            background: rgba(239, 68, 68, 0.1);
        }

        .add-item-btn {
            margin-top: 1.5rem;
            width: 100%;
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary);
            border: 1px dashed var(--primary);
        }

        .add-item-btn:hover {
            background: rgba(99, 102, 241, 0.2);
        }

        .results {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .result-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 1rem;
            padding: 1.5rem;
            border-left: 4px solid var(--primary);
        }

        .result-card.success {
            border-left-color: var(--accent);
        }

        .result-label {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .result-value {
            font-size: 2rem;
            font-weight: 700;
            margin-top: 0.25rem;
        }

        .result-details {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }

        .exchange-info {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 1rem;
            text-align: center;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        .github-corner:hover .octo-arm { animation: octocat-wave 560ms ease-in-out }
        @keyframes octocat-wave {
            0%,100% { transform: rotate(0) }
            20%,60% { transform: rotate(-25deg) }
            40%,80% { transform: rotate(10deg) }
        }
        @media (max-width:500px) {
            .github-corner:hover .octo-arm { animation: none }
            .github-corner .octo-arm { animation: octocat-wave 560ms ease-in-out }
        }
    </style>
</head>
<body>
    <a href="https://github.com/aneuhaus/budget-salary-html" class="github-corner" aria-label="View source on GitHub">
        <svg width="80" height="80" viewBox="0 0 250 250" style="fill:#151513; color:#fff; position: absolute; top: 0; border: 0; right: 0;" aria-hidden="true">
            <path d="M0,0 L115,115 L130,115 L142,142 L250,250 L250,0 Z"></path>
            <path d="M128.3,109.0 C113.8,99.7 119.0,89.6 119.0,89.6 C122.0,82.7 120.5,78.6 120.5,78.6 C119.2,72.0 123.4,76.3 123.4,76.3 C127.3,80.9 125.5,87.3 125.5,87.3 C122.9,97.6 130.6,101.9 134.4,103.2" fill="currentColor" style="transform-origin: 130px 106px;" class="octo-arm"></path>
            <path d="M115.0,115.0 C114.9,115.1 118.7,116.5 119.8,115.4 L133.7,101.6 C136.9,99.2 139.9,98.4 142.2,98.6 C133.8,88.0 127.5,74.4 143.8,58.0 C148.5,53.4 154.0,51.2 159.7,51.0 C160.3,49.4 163.2,43.6 171.4,40.1 C171.4,40.1 176.1,42.5 178.8,56.2 C183.1,58.6 187.2,61.8 190.9,65.4 C194.5,69.0 197.7,73.2 200.1,77.6 C213.8,80.2 216.3,84.9 216.3,84.9 C212.7,93.1 206.9,96.0 205.4,96.6 C205.1,102.4 203.0,107.8 198.3,112.5 C181.9,128.9 168.3,122.5 157.7,114.1 C157.9,116.9 156.7,120.9 152.7,124.9 L141.0,136.5 C139.8,137.7 141.6,141.9 141.8,141.8 Z" fill="currentColor" class="octo-body"></path>
        </svg>
    </a>
    <div class="container">
        <header>
            <h1>Bridge</h1>
            <p class="subtitle">Budget & Salary Calculator</p>
        </header>

        <main class="grid">
            <!-- Left: Inputs -->
            <div class="card">
                <h2>Configuration</h2>
                <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 2rem;">
                    <div class="input-group" style="margin-bottom: 0;">
                        <label for="currency">Base Currency</label>
                        <select id="currency">
                            <option value="BRL">BRL</option>
                            <option value="EUR">EUR</option>
                            <option value="GBP">GBP</option>
                            <option value="ARS">ARS</option>
                            <option value="CLP">CLP</option>
                            <option value="MXN">MXN</option>
                        </select>
                    </div>
                    <div class="input-group" style="margin-bottom: 0;">
                        <label for="taxRate">Tax Rate (%)</label>
                        <input type="number" id="taxRate" step="0.1" value="27.5">
                    </div>
                </div>

                <h2>Expenses</h2>
                <div id="budgetList" class="budget-list">
                    <!-- Items will be injected here -->
                </div>
                <button id="addItem" class="btn add-item-btn">
                    <span>+</span> Add Expense
                </button>
            </div>

            <!-- Right: Results -->
            <div class="card" style="display: flex; flex-direction: column; justify-content: space-between;">
                <div>
                    <h2>Summary</h2>
                    <div class="results">
                        <div class="result-card">
                            <div class="result-label">Total Monthly Expenses (<span class="curr-label">BRL</span>)</div>
                            <div id="totalBudget" class="result-value">0.00</div>
                        </div>
                        <div class="result-card">
                            <div class="result-label">Required Gross Salary (<span class="curr-label">BRL</span>)</div>
                            <div id="grossSalaryBase" class="result-value">0.00</div>
                            <div class="result-details">
                                <span>Total Taxes:</span>
                                <span id="totalTaxes">0.00</span>
                                <span>(<span class="tax-rate-label">0</span> %)</span>
                            </div>
                        </div>
                        <div class="result-card success">
                            <div class="result-label">Required Gross Salary (USD)</div>
                            <div id="grossSalaryUSD" class="result-value">$ 0.00</div>
                        </div>
                    </div>
                </div>

                <div class="exchange-info">
                    <p id="exchangeStatus">Fetching latest exchange rates...</p>
                    <p id="lastUpdated"></p>
                </div>
            </div>
        </main>
    </div>

    <template id="expense-item-template">
        <div class="budget-item">
            <input type="text" class="expense-name" placeholder="Expense name">
            <input type="number" class="expense-value" placeholder="0">
            <button class="btn btn-ghost remove-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"></path></svg>
            </button>
        </div>
    </template>

    <script>
        const DEFAULT_DATA = {
            currency: 'BRL',
            taxRate: 27.5,
            budget: [
                { name: 'Rent', value: 3700 },
                { name: 'Condo', value: 1450 },
                { name: 'Food', value: 1000 },
                { name: 'Power', value: 120 },
                { name: 'Internet', value: 150 },
                { name: 'Cell Phone', value: 50 },
                { name: 'Pharmacy', value: 300 },
                { name: 'Health Insurance', value: 600 },
                { name: 'Car Insurance', value: 200 },
                { name: 'Fuel', value: 200 },
                { name: 'Leisure', value: 800 },
                { name: 'Subscriptions', value: 150 },
                { name: 'Gym', value: 400 },
                { name: 'Clothes', value: 200 },
                { name: 'Emergency Fund', value: 500 },
                { name: 'Desired Savings', value: 4000 }
            ]
        };

        let state = JSON.parse(localStorage.getItem('budget_state')) || DEFAULT_DATA;
        let exchangeRate = 0.18; // Fallback

        const budgetListEl = document.getElementById('budgetList');
        const currencyEl = document.getElementById('currency');
        const taxRateEl = document.getElementById('taxRate');
        const totalBudgetEl = document.getElementById('totalBudget');
        const totalTaxesEl = document.getElementById('totalTaxes');
        const grossSalaryBaseEl = document.getElementById('grossSalaryBase');
        const grossSalaryUSDEl = document.getElementById('grossSalaryUSD');
        const exchangeStatusEl = document.getElementById('exchangeStatus');
        const currLabels = document.querySelectorAll('.curr-label');
        const taxRateLabel = document.querySelector('.tax-rate-label');

        function saveState() {
            localStorage.setItem('budget_state', JSON.stringify(state));
        }

        async function fetchExchangeRate() {

            try {
                exchangeStatusEl.textContent = `Fetching rate for ${state.currency}...`;
                const res = await fetch(`https://open.er-api.com/v6/latest/${state.currency}`);
                const data = await res.json();
                exchangeRate = data.rates.USD;
                exchangeStatusEl.innerHTML = `
                  <p>${data.time_last_update_utc.slice(5,25)}</p>
                  <p>USD = ${(1 / exchangeRate).toFixed(4)} ${state.currency}</p>
                `;
                calculate();
            } catch (err) {
                console.error('Exchange rate fetch failed', err);
                exchangeStatusEl.textContent = 'Using fallback exchange rate (0.18)';
            }
        }

        function createItemEl(item, index) {
            const template = document.getElementById('expense-item-template');
            const clone = template.content.cloneNode(true);
            
            const nameInput = clone.querySelector('.expense-name');
            nameInput.value = item.name;
            nameInput.onchange = (e) => updateItem(index, 'name', e.target.value);
            
            const valueInput = clone.querySelector('.expense-value');
            valueInput.value = item.value;
            valueInput.onchange = (e) => updateItem(index, 'value', e.target.value);
            
            const removeBtn = clone.querySelector('.remove-item');
            removeBtn.onclick = () => removeItem(index);
            
            return clone;
        }

        function renderList() {
            budgetListEl.innerHTML = '';
            state.budget.forEach((item, index) => {
                budgetListEl.appendChild(createItemEl(item, index));
            });
        }

        window.updateItem = (index, key, val) => {
            state.budget[index][key] = key === 'value' ? parseFloat(val) || 0 : val;
            saveState();
            calculate();
        };

        window.removeItem = (index) => {
            state.budget.splice(index, 1);
            saveState();
            renderList();
            calculate();
        };

        document.getElementById('addItem').onclick = () => {
            state.budget.push({ name: '', value: 0 });
            saveState();
            renderList();
            const lastItem = budgetListEl.lastElementChild;
            lastItem.querySelector('input').focus();
        };

        currencyEl.onchange = (e) => {
            state.currency = e.target.value;
            currLabels.forEach(el => el.textContent = state.currency);
            saveState();
            fetchExchangeRate();
        };

        taxRateEl.onchange = (e) => {
            state.taxRate = parseFloat(e.target.value) || 0;
            saveState();
            calculate();
        };

        function calculate() {
            const total = state.budget.reduce((acc, item) => acc + (item.value || 0), 0);
            const taxFactor = 1 - (state.taxRate / 100);
            const grossBase = total / taxFactor;
            const totalTaxes = Math.abs(total - grossBase);
            const grossUSD = grossBase * exchangeRate;
            taxRateLabel.textContent = state.taxRate.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });

            totalBudgetEl.textContent = `${total.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })} ${state.currency}`;
            totalTaxesEl.textContent = `${totalTaxes.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })} ${state.currency}`;
            grossSalaryBaseEl.textContent = `${grossBase.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })} ${state.currency}`;
            grossSalaryUSDEl.textContent = `$ ${grossUSD.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        }

        // Init
        currencyEl.value = state.currency;
        currLabels.forEach(el => el.textContent = state.currency);
        taxRateEl.value = state.taxRate;
        renderList();
        fetchExchangeRate();
    </script>
</body>
</html>
